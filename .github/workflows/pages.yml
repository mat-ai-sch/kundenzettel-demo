name: Kundenzettel-Demo veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mat-ai-sch/kundenzettel-website
          ref: main
          path: website
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/portal/package-lock.json
      - run: npm ci
        working-directory: website/portal
      - run: npm run build
        working-directory: website/portal
        env:
          VITE_PUBLIC_SURFACE: whatsapp
          VITE_RUNTIME_MODE: preview
          VITE_BASE_PATH: /
      - run: test -f website/portal/dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/portal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
