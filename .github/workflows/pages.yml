name: Kundenzettel-Demo veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.release.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Statische Veröffentlichung prüfen
        id: release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json, os
          root = Path('site')
          release = json.loads((root / 'release.json').read_text())
          assert release['mode'] == 'static-preview'
          assert release['sourceBranch'] == 'feat/kundenzettel-ui-kit-demo'
          assert (root / 'index.html').is_file()
          assert (root / 'impressum/index.html').is_file()
          assert (root / 'datenschutz/index.html').is_file()
          assert (root / 'sw.js').is_file(), 'Ablösung des früheren Demo-Offline-Workers fehlt'
          assert (root / '_v/update.html').is_file(), 'Direkter Aktualisierungsweg fehlt'
          assert (root / 'CNAME').read_text().strip() == 'demo.kundenzettel.de'
          assert sorted(p.relative_to(root / 'alt').as_posix() for p in (root / 'alt').rglob('*') if p.is_file()) == ['index.html'], 'Alte Archiv-Demo darf nicht veröffentlicht werden'
          for item in release['files']:
              path = (root / item['path']).resolve()
              assert root.resolve() in path.parents
              assert sha256(path.read_bytes()).hexdigest() == item['sha256'], item['path']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_commit=' + release['sourceCommit'] + '\n')
          print('Geprüfter Quellstand:', release['sourceCommit'])
          PY
          node --check site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: HTTPS-Status der beiden Adressen festhalten
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          for host in ['demo.kundenzettel.de', 'www.demo.kundenzettel.de']:
              try:
                  with urllib.request.urlopen(f'https://{host}/release.json?verify=' + os.environ['EXPECTED_SOURCE_COMMIT'], timeout=15) as response:
                      release = json.load(response)
                      assert release['sourceCommit'] == os.environ['EXPECTED_SOURCE_COMMIT']
                  print(f'::notice title=HTTPS-Status::{host}: TLS und veröffentlichter Quellstand bestätigt')
              except Exception as error:
                  message = f'{host}: {type(error).__name__}: {error}'.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::warning title=HTTPS-Status::' + message)
          try:
              base = 'https://demo.kundenzettel.de/'
              with urllib.request.urlopen(base + 'release.json?verify=' + os.environ['EXPECTED_SOURCE_COMMIT'], timeout=15) as response:
                  release = json.load(response)
              hashes = {item['path']: item['sha256'] for item in release['files']}
              for path, content_type in [('sw.js', 'javascript'), ('_v/update.html', 'text/html')]:
                  with urllib.request.urlopen(base + path + '?verify=' + os.environ['EXPECTED_SOURCE_COMMIT'], timeout=15) as response:
                      assert content_type in response.headers.get('Content-Type', '').lower()
                      assert hashlib.sha256(response.read()).hexdigest() == hashes[path]
              print('::notice title=Demo-Aktualisierung::Ablöse-Worker und direkter Aktualisierungseinstieg werden mit den geprüften Dateihashes ausgeliefert')
          except Exception as error:
              message = str(error).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::warning title=Demo-Aktualisierung::' + message)
          PY
      - name: Beide HTTPS-Adressen live prüfen
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request, urllib.parse
          expected = os.environ['EXPECTED_SOURCE_COMMIT']
          deadline = time.monotonic() + 600
          for attempt in range(60):
              try:
                  for host in ['demo.kundenzettel.de', 'www.demo.kundenzettel.de']:
                      url = f'https://{host}/release.json?verify={expected}'
                      request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          release = json.load(response)
                          assert response.status == 200
                          target = urllib.parse.urlsplit(response.url)
                          assert target.hostname == 'demo.kundenzettel.de'
                          assert target.path == '/release.json'
                          assert urllib.parse.parse_qs(target.query).get('verify') == [expected]
                      assert release['sourceCommit'] == expected
                      assert release['mode'] == 'static-preview'
                  hashes = {item['path']: item['sha256'] for item in release['files']}
                  for path, content_type in [('sw.js', 'javascript'), ('_v/update.html', 'text/html')]:
                      request = urllib.request.Request('https://demo.kundenzettel.de/' + path + '?verify=' + expected, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          assert content_type in response.headers.get('Content-Type', '').lower()
                          assert hashlib.sha256(response.read()).hexdigest() == hashes[path]
                  print('Beide HTTPS-Adressen liefern den geprüften Demo-Quellstand:', expected)
                  break
              except Exception as error:
                  if attempt == 59 or time.monotonic() >= deadline:
                      message = str(error).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Live-HTTPS::' + message)
                      raise
                  print('DNS, Zertifikat oder Pages-Veröffentlichung noch nicht bereit:', type(error).__name__)
                  time.sleep(10)
          PY
      - name: HTTPS-Erzwingung bestätigen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .https_enforced)" = "true"
